[workspace]
members = [
    "tiff2",
    "wasm_tiff",
    "compare",
    "ratatiff",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/feefladder/tiff2"
repository = "https://github.com/feefladder/tiff2"

[workspace.dependencies]
tiff2 = { path = "tiff2" }

exn = { version = "0.3.0", git = "https://github.com/feefladder/exn.git", branch = "into-error" }
